[package]
name = "mythicshot-recording"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Screen recording to compressed frames on disk, and GIF export"

[dependencies]
pinray = "0.2"
zstd = "0.13"
png = "0.18"
gifski = { version = "1.34", default-features = false }
imgref = "1"
rgb = "0.8"
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
xcap = "0.9"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
