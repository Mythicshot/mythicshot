[package]
name = "mythicshot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Screenshot and GIF recording tool in the spirit of Greenshot"

[dependencies]
mythicshot-capture = { path = "../capture" }
mythicshot-editor = { path = "../editor" }
mythicshot-destinations = { path = "../destinations" }
rfd = "0.17"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
tray-icon = "0.26"
global-hotkey = "0.9"
rdev = "0.5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }
