[package]
name = "mythicshot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Screenshot and GIF recording tool in the spirit of Greenshot"

[dependencies]
mythicshot-capture = { path = "../capture" }
mythicshot-editor = { path = "../editor" }
mythicshot-destinations = { path = "../destinations" }
mythicshot-recording = { path = "../recording" }
raw-window-handle = "0.6"
rfd = "0.17"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "wayland", "x11"] }
tray-icon = "0.26"
global-hotkey = "0.9"
rdev = "0.5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
# Upload client: TLS through rustls, certificates checked against the system trust store.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# The API token lives only in the OS credential store.
keyring = "4"
tempfile = "3"
# Content hashes in the names of a site's shared player files.
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
