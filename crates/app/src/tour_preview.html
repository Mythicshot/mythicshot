<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Tour preview</title>
<style>/*PLAYER_CSS_BEGIN*/
  /* The player's own colours, each named by its role. A tour's accent, card style, backdrop and logo are not here. */
  /*CHROME_BEGIN*/:root {
    --chrome-ground: #16121c;                     /* ground */
    --chrome-surface: #1e1928;                    /* surface */
    --chrome-border: #3a3250;                     /* border */
    --chrome-border-strong: #7c7399;              /* border-strong */
    --chrome-text: #ede8f5;                       /* text */
    --chrome-muted: #b2a8c6;                      /* text-muted */
    --chrome-gold: #f5b841;                       /* gold */
    --chrome-gold-soft: rgba(245, 184, 65, .18);  /* gold at .18 */
    --chrome-gold-pulse: rgba(245, 184, 65, .6);  /* gold at .6 */
    --chrome-gold-gone: rgba(245, 184, 65, 0);    /* gold at 0 */
    --chrome-gold-text: #f5b841;                  /* accent-text */
    --chrome-focus: #f5b841;                      /* focus */
    --chrome-focus-light: #8a5a00;                /* focus on light */
    --chrome-end-scrim: rgba(22, 18, 28, .72);    /* ground at .72 */
  }/*CHROME_END*/
  :root { color-scheme: dark; --accent: #5dcaa5; --on-accent: #0c1d17; --accent-soft: rgba(93, 202, 165, .18); --ease: cubic-bezier(.22,.8,.26,1); /* One hotspot pulse. */ --pulse-period: 1.9s; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--chrome-ground); color: var(--chrome-text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--chrome-border); }
  header h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { padding: 2px 8px; border: 1px solid var(--chrome-border-strong); border-radius: 999px; color: var(--chrome-muted); font-size: 12px; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #stage { position: relative; display: inline-block; line-height: 0; }
  #frame, #view { position: relative; }
  #shot { display: block; max-width: calc(100vw - 32px); max-height: calc(100vh - 130px); border-radius: 6px; box-shadow: 0 6px 30px rgba(0, 0, 0, .5); }
  #dim { position: absolute; inset: 0; z-index: 1; overflow: hidden; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .4s ease-out; }
  #dim.on { opacity: 1; }
  #dim[hidden] { display: none; }
  #hole { position: absolute; border-radius: 3px; }
  #layer { position: absolute; inset: 0; z-index: 2; overflow: hidden; border-radius: 6px; container-type: size; pointer-events: none; line-height: 1.25; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #layer svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .note { position: absolute; white-space: pre; }
  .bubble-text { position: absolute; display: flex; align-items: center; padding: .45em .6em; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  #ring { position: absolute; z-index: 3; width: 36px; height: 36px; margin: -18px 0 0 -18px; padding: 0; border: 3px solid var(--chrome-gold); border-radius: 50%; background: var(--chrome-gold-soft); cursor: pointer; animation: pulse 1.4s ease-out infinite; }
  #ring[hidden] { display: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--chrome-gold-pulse); } 100% { box-shadow: 0 0 0 20px var(--chrome-gold-gone); } }
  #end { display: none; position: absolute; inset: 0; z-index: 4; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: var(--chrome-end-scrim); border-radius: 6px; line-height: 1.4; font-size: 18px; }
  #end.on { display: flex; }
  #restart { color: var(--chrome-gold-text); }
  :focus-visible { outline: 2px solid var(--chrome-focus); outline-offset: 2px; }
  #card.light :focus-visible, #card.compact :focus-visible { outline: 2px solid var(--chrome-focus-light); outline-offset: 2px; }
  body:not(.v3) #ring:focus-visible { outline: 2px solid var(--chrome-text); outline-offset: 2px; }
  footer { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--chrome-border); }
  button { padding: 6px 14px; border: 1px solid var(--chrome-border-strong); border-radius: 6px; background: var(--chrome-surface); color: inherit; font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Version 3: the guided experience. Nothing below applies to an older manifest. */
  body.v3 { background: var(--backdrop, #121419); }
  .v3 header, .v3 footer { border-color: rgba(255, 255, 255, .06); }
  .v3 main { overflow: auto; align-items: safe center; }
  .v3 main { touch-action: pan-y; }
  /* On a phone the image stays put at the top while a docked card comes and goes below it. */
  @media (max-width: 640px) {
    .v3 main { align-items: flex-start; }
  }
  .v3 #frame { overflow: hidden; border-radius: 14px; box-shadow: 0 14px 44px rgba(0, 0, 0, .38), 0 0 0 1px rgba(255, 255, 255, .05); isolation: isolate; }
  .v3 #frame.anywhere { cursor: pointer; }
  .v3 #shot { max-height: calc(100vh - 140px); border-radius: 0; box-shadow: none; }
  .v3 #view { transform-origin: 0 0; transition: transform 550ms cubic-bezier(.22,.8,.26,1); will-change: transform; }
  .v3 #dim, .v3 #layer { border-radius: 0; }
  .v3 #dim { contain: strict; transition: opacity 400ms var(--ease); }
  .v3 #hole.soft { border-radius: 10px; }
  .v3 #hole.glide { transition: left 550ms var(--ease), top 550ms var(--ease), width 550ms var(--ease), height 550ms var(--ease); }
  .v3 #ring { width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 2px solid var(--accent); background: var(--accent-soft); animation: none; }
  .v3 #ring::before { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent); }
  .v3 #ring.pulse::after { content: ""; position: absolute; inset: -2px; border: 2px solid var(--accent); border-radius: 50%; animation: softpulse var(--pulse-period) var(--ease) infinite; pointer-events: none; }
  .v3 #ring.ghost { opacity: 0; }
  @keyframes softpulse { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(2.2); opacity: 0; } }
  #bar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; height: 3px; background: rgba(255, 255, 255, .1); line-height: 0; }
  #bar-fill { height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; transition: transform 550ms var(--ease); }
  #scrim { position: absolute; inset: 0; z-index: 4; background: rgba(10, 12, 16, .6); opacity: 0; pointer-events: none; transition: opacity 400ms var(--ease); }
  #scrim.on { opacity: 1; }
  #cta { position: absolute; top: 12px; right: 12px; z-index: 6; max-width: calc(100% - 24px); padding: 7px 14px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; line-height: 1.2; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 16px rgba(0, 0, 0, .28); transition: opacity 280ms var(--ease); }
  #cta.left { right: auto; left: 12px; }
  #cta:hover { filter: brightness(1.06); }
  @media (max-width: 640px) { #cta { top: 9px; right: 9px; padding: 5px 11px; font-size: 12px; } #cta.left { left: 9px; } }

  #card { position: absolute; left: 0; top: 0; z-index: 7; padding: 16px 18px 14px; border: 1px solid transparent; border-radius: 14px; font-size: 14px; line-height: 1.45; text-align: left; opacity: 0; transform: translateY(8px); transition: opacity 280ms var(--ease), transform 280ms var(--ease); }
  #card.in { opacity: 1; transform: none; }
  #card.now { transition: none; }
  #card.dark { background: #1a1e26; border-color: rgba(255, 255, 255, .07); color: #eef1f6; box-shadow: 0 18px 44px rgba(0, 0, 0, .42), 0 2px 6px rgba(0, 0, 0, .28); }
  #card.light { background: #fcfcfd; border-color: rgba(16, 22, 32, .08); color: #1b2029; box-shadow: 0 18px 44px rgba(8, 14, 24, .22), 0 2px 6px rgba(8, 14, 24, .1); }
  #card.dark .c-body, #card.dark .p-body { color: #b6becb; }
  #card.light .c-body, #card.light .p-body { color: #4a5262; }
  #card.dark strong { color: #f4f6fa; }
  #card.light strong { color: #12161d; }
  #card button, #card a { border: 0; border-radius: 9px; font: inherit; line-height: 1.2; text-decoration: none; cursor: pointer; }
  .c-title { margin: 0 0 4px; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
  .c-body { white-space: pre-line; overflow-wrap: anywhere; }
  .c-body strong { font-weight: 650; }
  .c-foot { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  #card .c-back { padding: 5px 9px; background: transparent; color: inherit; opacity: .75; font-size: 15px; }
  #card .c-back:hover { opacity: 1; }
  #card .c-back:disabled { opacity: .3; cursor: default; }
  .c-count { flex: 1; font-size: 12px; opacity: .62; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #card .c-next, #card .p-btn { padding: 8px 16px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #card .c-next:hover, #card .p-btn:hover { filter: brightness(1.07); }
  #card .p-ghost { padding: 7px 15px; background: transparent; color: inherit; box-shadow: inset 0 0 0 1px currentColor; opacity: .85; }
  #card .p-ghost:hover { opacity: 1; }
  .notch { position: absolute; width: 12px; height: 12px; background: inherit; border: 0 solid; border-color: inherit; transform: rotate(45deg); pointer-events: none; }
  .notch.up { top: -7px; border-width: 1px 0 0 1px; }
  .notch.down { bottom: -7px; border-width: 0 1px 1px 0; }
  .notch.toleft { left: -7px; border-width: 0 0 1px 1px; }
  .notch.toright { right: -7px; border-width: 1px 1px 0 0; }
  /* The compact bar: a light pill with the counter, the text and the button on one line, in Light's colours. */
  #card.compact { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 8px; border-radius: 999px; background: #fcfcfd; border-color: rgba(16, 22, 32, .08); color: #1b2029; box-shadow: 0 10px 30px rgba(8, 14, 24, .22), 0 2px 6px rgba(8, 14, 24, .1); }
  #card.compact .c-body { flex: 1; min-width: 0; color: #4a5262; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #card.compact strong { color: #12161d; }
  #card.compact .c-back { border-radius: 999px; }
  #card.compact .c-count { flex: none; }
  #card.compact .c-next { flex: none; padding: 7px 14px; border-radius: 999px; }
  #card.panel { padding: 22px 24px 20px; text-align: center; }
  .p-logo { display: block; max-width: 140px; max-height: 48px; margin: 0 auto 14px; }
  .p-title { margin: 0 0 6px; font-size: 19px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
  .p-body { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .p-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  #card .p-actions > * { display: inline-block; }
  #autoplay { min-width: 76px; }
  #missing { display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--chrome-surface) repeating-linear-gradient(135deg, rgba(255, 255, 255, .03) 0 14px, transparent 14px 28px); color: var(--chrome-muted); font-size: 13px; line-height: 1.4; text-align: center; }
  .empty { margin: 0; color: var(--chrome-muted); font-size: 15px; line-height: 1.4; }
  .v3 #end { border-radius: 0; }
  .v3 #restart { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    #ring { animation: none; }
    #dim { transition: none; }
    .v3 #view, .v3 #dim, .v3 #hole.glide, #card, #scrim, #bar-fill, #cta { transition: none !important; }
    .v3 #ring.pulse::after { animation: none; display: none; }
  }
/*PLAYER_CSS_END*/</style>
</head>
<body>
<header><h1 id="title"></h1><span class="tag">Local preview</span></header>
<!--PLAYER_HTML_BEGIN--><main>
  <div id="stage">
    <div id="frame">
      <div id="view">
        <img id="shot" alt="">
        <div id="missing" hidden>This step's picture could not be loaded.</div>
        <div id="dim" hidden><div id="hole"></div></div>
        <div id="layer" aria-live="polite"></div>
        <button id="ring" type="button" aria-label="Next step" hidden></button>
      </div>
      <div id="bar" hidden><div id="bar-fill"></div></div>
      <div id="scrim"></div>
      <a id="cta" hidden></a>
      <div id="end"><span>End of tour</span><button id="restart" type="button">Restart</button></div>
    </div>
    <div id="card" role="group" hidden></div>
  </div>
</main>
<footer>
  <button id="prev">Back</button>
  <span id="count"></span>
  <button id="next">Next</button>
  <button id="autoplay" type="button" aria-label="Pause autoplay" hidden>Pause</button>
</footer>
<div id="status" class="sr" aria-live="polite"></div>
<!--PLAYER_HTML_END--><!--TOUR_IMAGES-->
<script>/*TOUR_CORE*/</script>
<script>
const TOUR = /*TOUR_JSON*/;
/*PLAYER_JS_BEGIN*/(function () {
  // Steps that are not objects are skipped.
  var steps = (Array.isArray(TOUR.steps) ? TOUR.steps : []).filter(function (s) { return s && typeof s === "object" && !Array.isArray(s); });
  var i = 0, done = false, drawn = -1;
  var $ = function (id) { return document.getElementById(id); };
  /*PREVIEW_ONLY_BEGIN*/document.title = TOUR.title + " (local preview)";/*PREVIEW_ONLY_END*/
  $("title").textContent = TOUR.title;
  if (!steps.length) {
    var empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "This tour has no steps.";
    document.querySelector("main").replaceChildren(empty);
    document.querySelector("footer").hidden = true;
    return;
  }
  // Only the bundle's own step images are loaded: step-001.png, step-002.jpg and so on.
  function stepImage(s) { return typeof s.image === "string" && /^step-[0-9]{3,}\.(png|jpg)$/.test(s.image) ? s.image : null; }
  // A single-file export carries each picture in its own block of base64 text under the same name; a
  // bundle loads the files. A picture becomes a data URL only when its step is shown or about to be, and
  // only those few are kept.
  var EMBEDDED = null, urls = {};
  Array.prototype.forEach.call(document.querySelectorAll('script[type="application/octet-stream"][data-tour-image]'), function (b) {
    EMBEDDED = EMBEDDED || {};
    EMBEDDED[b.getAttribute("data-tour-image")] = b;
  });
  function source(name) {
    if (!name || !EMBEDDED) return name;
    if (Object.prototype.hasOwnProperty.call(urls, name)) return urls[name];
    var block = Object.prototype.hasOwnProperty.call(EMBEDDED, name) ? EMBEDDED[name] : null;
    var type = block && block.getAttribute("data-type");
    if (type !== "image/png" && type !== "image/jpeg") return null;
    return (urls[name] = "data:" + type + ";base64," + block.textContent);
  }
  function keepOnly(names) { for (var k in urls) if (names.indexOf(k) < 0) delete urls[k]; }
  var SVG = "http://www.w3.org/2000/svg";
  // Layer values come from the manifest: numbers must be finite and colours plain #rrggbb.
  function num(v) { return typeof v === "number" && isFinite(v) ? Math.min(100, Math.max(0, v)) : null; }
  function colour(v, fallback) { return typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v) ? v : fallback; }
  function fontSize(n) { var v = num(n.size); return (v === null || v <= 0 ? 3 : v) + "cqh"; }
  function svgEl(name, attrs) {
    var el = document.createElementNS(SVG, name);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  // The darkening: everything outside the spotlight box, fading in on every step.
  function drawSpotlight(s) {
    var dim = $("dim"), a = s.spotlight, strength = typeof TOUR.spotlight_dim === "number" ? TOUR.spotlight_dim : 60;
    var box = a && [num(a.x), num(a.y), num(a.w), num(a.h)];
    if (!box || box.indexOf(null) !== -1) { dim.hidden = true; dim.className = ""; return; }
    var hole = $("hole");
    hole.style.left = box[0] + "%"; hole.style.top = box[1] + "%";
    hole.style.width = box[2] + "%"; hole.style.height = box[3] + "%";
    var alpha = Math.min(90, Math.max(10, strength)) / 100;
    hole.style.boxShadow = "0 0 0 1.5px rgba(255, 255, 255, .5), 0 0 0 200vmax rgba(0, 0, 0, " + alpha + ")";
    dim.hidden = false;
    dim.style.transition = "none"; dim.className = "";
    void dim.offsetWidth;
    dim.style.transition = ""; dim.className = "on";
  }
  // A rounded box whose outline runs out to the tail point on the side facing it.
  function bubblePath(x, y, w, h, tx, ty) {
    var r = Math.min(w, h) * 0.18, cx = x + w / 2, cy = y + h / 2, dx = tx - cx, dy = ty - cy;
    var inside = tx > x && tx < x + w && ty > y && ty < y + h;
    var side = inside ? "" : (Math.abs(dy) * w >= Math.abs(dx) * h ? (dy > 0 ? "b" : "t") : (dx > 0 ? "r" : "l"));
    var sx = Math.max(0, Math.min(w * 0.18, w / 2 - r)), sy = Math.max(0, Math.min(h * 0.18, h / 2 - r));
    var tail = " L" + tx + " " + ty;
    var d = "M" + (x + r) + " " + y;
    if (side === "t") d += " L" + (cx - sx) + " " + y + tail + " L" + (cx + sx) + " " + y;
    d += " L" + (x + w - r) + " " + y + " Q" + (x + w) + " " + y + " " + (x + w) + " " + (y + r);
    if (side === "r") d += " L" + (x + w) + " " + (cy - sy) + tail + " L" + (x + w) + " " + (cy + sy);
    d += " L" + (x + w) + " " + (y + h - r) + " Q" + (x + w) + " " + (y + h) + " " + (x + w - r) + " " + (y + h);
    if (side === "b") d += " L" + (cx + sx) + " " + (y + h) + tail + " L" + (cx - sx) + " " + (y + h);
    d += " L" + (x + r) + " " + (y + h) + " Q" + x + " " + (y + h) + " " + x + " " + (y + h - r);
    if (side === "l") d += " L" + x + " " + (cy + sy) + tail + " L" + x + " " + (cy - sy);
    d += " L" + x + " " + (y + r) + " Q" + x + " " + y + " " + (x + r) + " " + y + " Z";
    return d;
  }
  // Notes sit at their percentages; font sizes are a share of the displayed image height (cqh).
  function drawNotes(s) {
    var layer = $("layer"), notes = Array.isArray(s.notes) ? s.notes : [];
    var W = s.width > 0 ? s.width : 100, H = s.height > 0 ? s.height : 100;
    var shapes = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", "aria-hidden": "true" });
    var texts = [];
    notes.forEach(function (n) {
      if (!n || typeof n !== "object") return;
      var x = num(n.x), y = num(n.y), el = document.createElement("div");
      if (x === null || y === null || typeof n.text !== "string") return;
      el.style.left = x + "%"; el.style.top = y + "%";
      el.style.fontSize = fontSize(n);
      el.textContent = n.text;
      if (n.kind === "bubble") {
        var w = num(n.w), h = num(n.h), tx = n.tail && num(n.tail.x), ty = n.tail && num(n.tail.y);
        if (w === null || h === null || w <= 0 || h <= 0) return;
        if (tx === null || ty === null) { tx = x + w / 2; ty = y + h / 2; }
        shapes.appendChild(svgEl("path", {
          d: bubblePath(x * W / 100, y * H / 100, w * W / 100, h * H / 100, tx * W / 100, ty * H / 100),
          fill: colour(n.fill, "#ffffff"), stroke: colour(n.color, "#1f2430"),
          "stroke-width": Math.max(2, H / 320), "stroke-linejoin": "round"
        }));
        el.className = "bubble-text";
        el.style.width = w + "%"; el.style.height = h + "%";
        el.style.color = colour(n.color, "#1f2430");
      } else if (n.kind === "text") {
        el.className = "note";
        el.style.color = colour(n.color, "#ffffff");
      } else return;
      texts.push(el);
    });
    layer.replaceChildren.apply(layer, [shapes].concat(texts));
  }

  var V3 = typeof TOUR.version === "number" && TOUR.version >= 3 && typeof TourCore === "object";
  if (!V3) {
    // Versions 1 and 2: the plain step-through, exactly as before.
    var show = function () {
      var s = steps[i], last = i === steps.length - 1, img = stepImage(s);
      if (source(img)) $("shot").src = source(img); else $("shot").removeAttribute("src");
      // Only a new step redraws the layer, so the end panel or a repeated key does not replay the fade.
      if (i !== drawn) { drawn = i; drawSpotlight(s); drawNotes(s); }
      var finished = done || (last && !s.click);
      var ring = $("ring");
      ring.hidden = !s.click || finished;
      if (s.click) { ring.style.left = s.click.x + "%"; ring.style.top = s.click.y + "%"; }
      $("end").className = finished ? "on" : "";
      $("count").textContent = "Step " + (i + 1) + " of " + steps.length;
      $("prev").disabled = i === 0;
      $("next").disabled = finished;
    };
    var go = function (d) {
      var n = i + d;
      if (n >= steps.length) { done = true; show(); $("restart").focus(); }
      else if (n >= 0) { i = n; done = false; show(); }
    };
    $("ring").onclick = function () { go(1); };
    $("next").onclick = function () { go(1); };
    $("prev").onclick = function () { go(-1); };
    $("restart").onclick = function () { i = 0; done = false; show(); };
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
    });
    show();
    return;

  function replay() { stopAutoplay(); nav = { via: "", from: document.activeElement, force: false }; start(); }
  ring.onclick = function () { go(1, false, "hotspot"); };
  $("next").onclick = function () { go(1); };
  $("prev").onclick = function () { go(-1); };
  $("restart").onclick = function () { replay(); };
  frame.addEventListener("click", function (e) {
    if (phase === "step" && !finished() && steps[i].advance === "anywhere" && !e.target.closest("button, a")) go(1, false, "hotspot");
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") go(1, false, "key"); else if (e.key === "ArrowLeft") go(-1, false, "key");
  });
  // A horizontal swipe of at least 40 px anywhere around the image.
  var touch = null, area = document.querySelector("main");
  area.addEventListener("touchstart", function (e) { touch = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
  area.addEventListener("touchend", function (e) {
    if (!touch) return;
    var t = e.changedTouches[0], dx = t.clientX - touch[0], dy = t.clientY - touch[1];
    touch = null;
    if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });

  // ---- Autoplay: pauses on hover and keyboard focus, stops for good on any manual step ----
  var playBtn = $("autoplay"), playing = false, hoverHold = false, focusHold = false, playTimer = 0;
  function playable() { return playOn && !reduced.matches; }
  function showPlay() {
    playBtn.hidden = !playable();
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.setAttribute("aria-label", playing ? "Pause autoplay" : "Play autoplay");
  }
  function schedule() {
    clearTimeout(playTimer);
    if (!playing || hoverHold || focusHold || document.hidden || phase !== "step" || finished()) return;
    playTimer = setTimeout(function () {
      if (playing && !hoverHold && !focusHold && !document.hidden) go(1, true);
    }, playMs);
  }
  // A hidden tab holds autoplay; it carries on when shown again only if it was playing.
  document.addEventListener("visibilitychange", schedule);
  function stopAutoplay() { playing = false; clearTimeout(playTimer); showPlay(); }
  playBtn.onclick = function () {
    playing = !playing && playable();
    showPlay();
    schedule();
  };
  stage.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") { hoverHold = true; schedule(); } });
  stage.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") { hoverHold = false; schedule(); } });
  function checkFocus() {
    var a = document.activeElement;
    // Keyboard focus only: a control focused by a mouse click does not hold autoplay.
    var keyboard = false;
    try { keyboard = !!a && a.matches(":focus-visible"); } catch (err) { keyboard = true; }
    focusHold = keyboard && a !== playBtn && a !== document.body && !!a.closest("button, a");
    schedule();
  }
  document.addEventListener("focusin", checkFocus);
  document.addEventListener("focusout", function () { setTimeout(checkFocus, 0); });
  reduced.addEventListener("change", function () { if (reduced.matches) stopAutoplay(); else showPlay(); });
  prefersDark.addEventListener("change", function () {
    if (cardStyle !== "auto") return;
    nav = { via: "", from: document.activeElement, force: false };
    buildCard(); refocus(); layout(false);
    nav = { via: "", from: null, force: false };
  });

  playing = playable();
  showPlay();
  render();
})();/*PLAYER_JS_END*/
