<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<link rel="icon" href="favicon.ico">
<style>
  /* The index's colours, each a copy of the brand token named beside it (tokens.json), light values first and
     dark values below, since the page follows the system theme. A brand change is these two blocks. */
  :root {
    color-scheme: light dark;
    --bg: #f7f5fb;     /* ground */
    --card: #fdfcff;   /* surface */
    --line: #ddd7ea;   /* border */
    --shade: #ddd7ea;  /* border, as the fill behind a picture still loading */
    --fg: #1d1828;     /* text */
    --muted: #5c5470;  /* text-muted */
    --focus: #8a5a00;  /* focus */
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #16121c;     /* ground */
    --card: #1e1928;   /* surface */
    --line: #3a3250;   /* border */
    --shade: #3a3250;  /* border, as the fill behind a picture still loading */
    --fg: #ede8f5;     /* text */
    --muted: #b2a8c6;  /* text-muted */
    --focus: #f5b841;  /* focus */
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0; font-size: 26px; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
  .count { margin: 4px 0 24px; color: var(--muted); }
  .tours { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .tour { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); color: inherit; text-decoration: none; }
  .tour:hover { border-color: var(--muted); }
  .tour:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tour img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--shade); }
  .tour b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; margin: 12px 14px 2px; font-weight: 600; overflow-wrap: anywhere; }
  .tour span { margin: 0 14px 14px; color: var(--muted); font-size: 13px; }
  @media (max-width: 520px) { main { padding-top: 20px; } h1 { font-size: 22px; } .tours { grid-template-columns: 1fr; gap: 14px; } }
</style>
</head>
<body>
<main>
<h1>{{title}}</h1>
<p class="count">{{count}}</p>
<div class="tours">
{{cards}}</div>
</main>
</body>
</html>
