[workspace]
resolver = "3"
members = ["crates/app", "crates/capture", "crates/destinations", "crates/editor", "crates/recording", "spikes/phase0"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.package]
version = "0.2.43"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Dependencies (gifski, zstd, image) run far too slowly unoptimised; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2

# The window library, patched where it ended the program on a monitor that had just gone (it
# unwrapped ERROR_INVALID_MONITOR_HANDLE while reading the size of the monitor a window is on,
# which the UI framework does every frame). The published 0.30.13, with only the lines marked "Patched".
# Drop this once a published version reads a vanished monitor without panicking.
[patch.crates-io]
winit = { path = "vendor/winit" }
