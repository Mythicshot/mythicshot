# Build and test on Windows, macOS and Linux for every push and pull request.
name: CI

on:
  push:
  pull_request:

# Read-only: CI builds and tests, and never publishes anything.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        # GTK and app indicators for the tray, X11/Wayland for windows and
        # hotkeys, PipeWire and DBus for screen capture, clang for bindgen.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libx11-dev libxtst-dev libxi-dev libxrandr-dev libxcb1-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev \
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev clang pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p mythicshot

      - name: Test
        run: cargo test --workspace

      - name: Upload the program
        uses: actions/upload-artifact@v4
        with:
          name: mythicshot-${{ runner.os }}
          path: |
            target/release/mythicshot.exe
            target/release/mythicshot
          if-no-files-found: ignore
