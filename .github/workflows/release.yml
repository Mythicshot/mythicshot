# Builds an UNSIGNED Windows installer for testing, by hand only (Actions tab, "Run workflow").
# It never publishes anything: the result is a workflow artifact named
# mythicshot-<version>-unsigned-not-for-release. Releases for the download page are made with
# scripts/release/release.mjs, which signs and checks them (docs/release.md).
name: Unsigned installer (not for release)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build, for example main"
        required: true
        default: main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Read the version from Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p mythicshot

      - name: Test
        run: cargo test --workspace --locked

      # WiX 5, as on the development PC (v6 needs a separate licence accepted).
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build the installer
        shell: pwsh
        working-directory: installer
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          wix build mythicshot.wxs ui.wxs -ext WixToolset.UI.wixext -arch x64 -d Version=$env:VERSION -d Exe=../target/release/mythicshot.exe -o ../dist/Mythicshot-$env:VERSION-x64-UNSIGNED.msi
          wix msi validate ../dist/Mythicshot-$env:VERSION-x64-UNSIGNED.msi

      - name: Keep the unsigned installer as a workflow artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: mythicshot-${{ env.VERSION }}-unsigned-not-for-release
          path: dist/Mythicshot-${{ env.VERSION }}-x64-UNSIGNED.msi
          if-no-files-found: error
          retention-days: 7
